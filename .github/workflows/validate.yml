name: Validate skill package

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python3 -m pip install -r tests/requirements.txt
      - run: python3 -B tests/test_skill.py
      - run: python3 -B tests/test_design_contracts.py
      - run: python3 -B tests/check_source_anchors.py --check-inventory
      - run: python3 -B -m unittest discover -s .agents/skills/static-graphic-design-creator/tests -p 'test_event_poster_codes.py'
        env:
          PYTHONDONTWRITEBYTECODE: "1"
